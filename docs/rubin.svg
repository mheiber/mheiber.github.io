<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
<defs>
<!-- Dark parchment texture pattern -->
<pattern id="parchment" patternUnits="userSpaceOnUse" width="100" height="100">
  <rect width="100" height="100" fill="#383838"/>
  <circle cx="20" cy="30" r="1" fill="#4a4a4a" opacity="0.3"/>
  <circle cx="80" cy="70" r="1.5" fill="#505050" opacity="0.2"/>
  <circle cx="45" cy="85" r="0.8" fill="#454545" opacity="0.25"/>
  <circle cx="15" cy="60" r="1.2" fill="#555555" opacity="0.2"/>
  <circle cx="75" cy="25" r="0.9" fill="#484848" opacity="0.3"/>
</pattern>

<!-- Synthwave gradients -->
<radialGradient id="headGlow" cx="50%" cy="50%" r="50%">
  <stop offset="0%" stop-color="#ff6b9d" stop-opacity="0.8"/>
  <stop offset="100%" stop-color="#c77dff" stop-opacity="0.3"/>
</radialGradient>

<linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
  <stop offset="0%" stop-color="#ff6b9d" stop-opacity="0.1"/>
  <stop offset="100%" stop-color="#c77dff" stop-opacity="0.1"/>
</linearGradient>

<radialGradient id="screenGlow" cx="50%" cy="50%" r="60%">
  <stop offset="0%" stop-color="#00f5ff" stop-opacity="0.6"/>
  <stop offset="100%" stop-color="#00f5ff" stop-opacity="0.1"/>
</radialGradient>

<!-- Filters for glows -->
<filter id="glow">
  <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
  <feMerge> 
    <feMergeNode in="coloredBlur"/>
    <feMergeNode in="SourceGraphic"/>
  </feMerge>
</filter>

<filter id="softGlow">
  <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
  <feMerge> 
    <feMergeNode in="coloredBlur"/>
    <feMergeNode in="SourceGraphic"/>
  </feMerge>
</filter>

<style>
  .hover-container {
    transition: all 0.3s ease;
  }
  
  .hover-container:hover .outer-aura {
    animation: pulse-outer 6s infinite;
  }
  
  .hover-container:hover .inner-aura {
    animation: pulse-inner 4s infinite 3s;
  }
  
  .hover-container:hover .main-figure {
    animation: float 4s infinite;
  }
  
  .hover-container:hover .head {
    animation: head-glow 3s infinite;
  }
  
  .hover-container:hover .beard {
    animation: beard-scale 5s infinite;
  }
  
  .hover-container:hover .left-arm {
    animation: arm-left 2s infinite;
  }
  
  .hover-container:hover .right-arm {
    animation: arm-right 2s infinite;
  }
  
  .hover-container:hover .laptop-base {
    animation: laptop-glow 2s infinite;
  }
  
  .hover-container:hover .laptop-screen {
    animation: screen-glow 2s infinite;
  }
  
  .hover-container:hover .particle-1 {
    animation: particle-float-1 6s infinite;
  }
  
  .hover-container:hover .particle-2 {
    animation: particle-float-2 7s infinite 1s;
  }
  
  .hover-container:hover .particle-3 {
    animation: particle-float-3 5.5s infinite 2s;
  }
  
  .hover-container:hover .particle-4 {
    animation: particle-float-4 6.5s infinite 3s;
  }
  
  .hover-container:hover .particle-5 {
    animation: particle-float-5 5s infinite 1.5s;
  }
  
  .hover-container:hover .particle-6 {
    animation: particle-float-6 6.2s infinite 2.5s;
  }
  
  .hover-container:hover .particle-7 {
    animation: particle-float-7 5.8s infinite 4s;
  }
  
  .hover-container:hover .particle-8 {
    animation: particle-float-8 6.8s infinite 0.5s;
  }
  
  .hover-container:hover .particle-9 {
    animation: particle-float-9 5.3s infinite 3.5s;
  }
  
  .hover-container:hover .particle-10 {
    animation: particle-float-10 7.2s infinite 1.8s;
  }
  
  .hover-container:hover .sparkle-1 {
    animation: sparkle 3s infinite;
  }
  
  .hover-container:hover .sparkle-2 {
    animation: sparkle 4s infinite 1s;
  }
  
  .hover-container:hover .sparkle-3 {
    animation: sparkle 2.5s infinite 2s;
  }
  
  .hover-container:hover .sparkle-4 {
    animation: sparkle 3.5s infinite 0.5s;
  }
  
  .hover-container:hover .sparkle-5 {
    animation: sparkle 4.2s infinite 1.5s;
  }
  
  .hover-container:hover .sparkle-6 {
    animation: sparkle 3.8s infinite 2.5s;
  }
  
  .hover-container:hover .sparkle-7 {
    animation: sparkle 2.8s infinite 3s;
  }
  
  @keyframes pulse-outer {
    0%, 100% { 
      r: 150px; 
      opacity: 0.4; 
    }
    50% { 
      r: 160px; 
      opacity: 0.7; 
    }
  }
  
  @keyframes pulse-inner {
    0%, 100% { 
      r: 100px; 
      opacity: 0.5; 
    }
    50% { 
      r: 110px; 
      opacity: 0.8; 
    }
  }
  
  @keyframes float {
    0%, 100% { transform: translate(400px, 300px); }
    50% { transform: translate(400px, 298px); }
  }
  
  @keyframes head-glow {
    0%, 100% { stroke: #ff6b9d; }
    33% { stroke: #c77dff; }
    66% { stroke: #ff6b9d; }
  }
  
  @keyframes beard-scale {
    0%, 100% { 
      transform: scale(1, 1); 
      opacity: 0.9; 
    }
    50% { 
      transform: scale(1, 1.05); 
      opacity: 1; 
    }
  }
  
  @keyframes arm-left {
    0%, 100% { transform: rotate(0deg); }
    25% { transform: rotate(-5deg); }
    75% { transform: rotate(5deg); }
  }
  
  @keyframes arm-right {
    0%, 100% { transform: rotate(0deg); }
    25% { transform: rotate(5deg); }
    75% { transform: rotate(-5deg); }
  }
  
  @keyframes laptop-glow {
    0%, 100% { stroke: #00f5ff; }
    50% { stroke: #40e0d0; }
  }
  
  @keyframes screen-glow {
    0%, 100% { fill-opacity: 0.3; }
    50% { fill-opacity: 0.6; }
  }
  
  @keyframes particle-float-1 {
    0% { transform: translate(0, 0); opacity: 0; }
    10% { opacity: 0.9; }
    90% { opacity: 0.9; }
    100% { transform: translate(-40px, -240px); opacity: 0; }
  }
  
  @keyframes particle-float-2 {
    0% { transform: translate(0, 0); opacity: 0; }
    10% { opacity: 0.8; }
    90% { opacity: 0.8; }
    100% { transform: translate(30px, -280px); opacity: 0; }
  }
  
  @keyframes particle-float-3 {
    0% { transform: translate(0, 0); opacity: 0; }
    10% { opacity: 0.95; }
    90% { opacity: 0.95; }
    100% { transform: translate(20px, -220px); opacity: 0; }
  }
  
  @keyframes particle-float-4 {
    0% { transform: translate(0, 0); opacity: 0; }
    10% { opacity: 0.85; }
    90% { opacity: 0.85; }
    100% { transform: translate(-20px, -260px); opacity: 0; }
  }
  
  @keyframes particle-float-5 {
    0% { transform: translate(0, 0); opacity: 0; }
    10% { opacity: 1; }
    90% { opacity: 1; }
    100% { transform: translate(50px, -200px); opacity: 0; }
  }
  
  @keyframes particle-float-6 {
    0% { transform: translate(0, 0); opacity: 0; }
    10% { opacity: 0.75; }
    90% { opacity: 0.75; }
    100% { transform: translate(-30px, -240px); opacity: 0; }
  }
  
  @keyframes particle-float-7 {
    0% { transform: translate(0, 0); opacity: 0; }
    10% { opacity: 0.9; }
    90% { opacity: 0.9; }
    100% { transform: translate(10px, -230px); opacity: 0; }
  }
  
  @keyframes particle-float-8 {
    0% { transform: translate(0, 0); opacity: 0; }
    10% { opacity: 0.8; }
    90% { opacity: 0.8; }
    100% { transform: translate(-40px, -250px); opacity: 0; }
  }
  
  @keyframes particle-float-9 {
    0% { transform: translate(0, 0); opacity: 0; }
    10% { opacity: 1; }
    90% { opacity: 1; }
    100% { transform: translate(24px, -210px); opacity: 0; }
  }
  
  @keyframes particle-float-10 {
    0% { transform: translate(0, 0); opacity: 0; }
    10% { opacity: 0.8; }
    90% { opacity: 0.8; }
    100% { transform: translate(-16px, -270px); opacity: 0; }
  }
  
  @keyframes sparkle {
    0%, 100% { 
      opacity: 0.6; 
      r: 1px; 
    }
    50% { 
      opacity: 1; 
      r: 2px; 
    }
  }
  
  .particle-1, .particle-2, .particle-3, .particle-4, .particle-5,
  .particle-6, .particle-7, .particle-8, .particle-9, .particle-10 {
    transform-origin: center;
  }
  
  .left-arm {
    transform-origin: -60px -20px;
  }
  
  .right-arm {
    transform-origin: 60px -20px;
  }
</style>
</defs>

<g class="hover-container">
  <!-- Dark background -->
  <rect width="100%" height="100%" fill="#383838"/>

  <!-- Subtle dark aging effects -->
  <ellipse cx="100" cy="80" rx="40" ry="20" fill="#2a2a2a" opacity="0.3"/>
  <ellipse cx="700" cy="150" rx="60" ry="30" fill="#303030" opacity="0.2"/>
  <ellipse cx="150" cy="500" rx="50" ry="25" fill="#282828" opacity="0.25"/>
  <ellipse cx="650" cy="480" rx="45" ry="22" fill="#323232" opacity="0.2"/>

  <!-- Outer aura -->
  <circle class="outer-aura" cx="400" cy="300" r="150" fill="none" stroke="#ff6b9d" stroke-width="1" opacity="0.4" filter="url(#softGlow)"/>

  <!-- Inner aura -->
  <circle class="inner-aura" cx="400" cy="300" r="100" fill="none" stroke="#c77dff" stroke-width="1" opacity="0.5" filter="url(#softGlow)"/>

  <!-- Main figure group -->
  <g class="main-figure" transform="translate(400,300)">

    <!-- Head -->
    <circle class="head" cx="0" cy="-80" r="40" fill="none" stroke="#ff6b9d" stroke-width="2" filter="url(#glow)"/>

    <!-- Beard (triangular) -->
    <polygon class="beard" points="0,-40 -25,10 25,10" fill="none" stroke="#c77dff" stroke-width="2" opacity="0.9" filter="url(#softGlow)"/>

    <!-- Body (rounded rectangle) -->
    <rect x="-60" y="-40" width="120" height="100" rx="15" ry="15" fill="url(#bodyGrad)" stroke="#ff6b9d" stroke-width="2" filter="url(#glow)"/>

    <!-- Left arm -->
    <line class="left-arm" x1="-60" y1="-20" x2="-110" y2="-10" stroke="#c77dff" stroke-width="2" filter="url(#softGlow)"/>

    <!-- Right arm -->
    <line class="right-arm" x1="60" y1="-20" x2="110" y2="-10" stroke="#c77dff" stroke-width="2" filter="url(#softGlow)"/>

    <!-- Laptop base -->
    <rect class="laptop-base" x="-50" y="70" width="100" height="40" rx="5" ry="5" fill="none" stroke="#00f5ff" stroke-width="2" filter="url(#glow)"/>

    <!-- Laptop screen -->
    <rect class="laptop-screen" x="-50" y="40" width="100" height="30" rx="5" ry="5" fill="url(#screenGlow)" stroke="#00f5ff" stroke-width="2" filter="url(#glow)"/>
  </g>

  <!-- Floating code particles with whimsical font -->
  <g font-family="Comic Sans MS, cursive, sans-serif" font-size="14" fill="#9bb5ff" opacity="0.9">

    <!-- Particle 1 -->
    <text class="particle-1" x="150" y="400" filter="url(#softGlow)">{ code }</text>

    <!-- Particle 2 -->
    <text class="particle-2" x="600" y="450" filter="url(#softGlow)" font-size="12">function()</text>

    <!-- Particle 3 -->
    <text class="particle-3" x="250" y="500" filter="url(#softGlow)" font-size="11">&lt;/div&gt;</text>

    <!-- Particle 4 -->
    <text class="particle-4" x="550" y="380" filter="url(#softGlow)" font-size="13">const magic</text>

    <!-- Particle 5 -->
    <text class="particle-5" x="180" y="350" filter="url(#softGlow)" font-size="10">[ array ]</text>

    <!-- Particle 6 -->
    <text class="particle-6" x="650" y="320" filter="url(#softGlow)" font-size="12">=> arrow</text>

    <!-- Particle 7 -->
    <text class="particle-7" x="120" y="480" filter="url(#softGlow)" font-size="11">while(true)</text>

    <!-- Particle 8 -->
    <text class="particle-8" x="680" y="420" filter="url(#softGlow)" font-size="13">@media</text>

    <!-- Particle 9 -->
    <text class="particle-9" x="300" y="420" filter="url(#softGlow)" font-size="10"># heading</text>

    <!-- Particle 10 -->
    <text class="particle-10" x="480" y="460" filter="url(#softGlow)" font-size="12">git commit</text>

  </g>

  <!-- Additional mystical sparkles -->
  <g fill="#ff6b9d" opacity="0.6">
    <circle class="sparkle-1" cx="100" cy="200" r="1"/>
    <circle class="sparkle-2" cx="700" cy="250" r="1.5"/>
    <circle class="sparkle-3" cx="150" cy="450" r="1.2"/>
    <circle class="sparkle-4" cx="650" cy="400" r="1"/>
  </g>

  <g fill="#c77dff" opacity="0.5">
    <circle class="sparkle-5" cx="200" cy="150" r="1.3"/>
    <circle class="sparkle-6" cx="600" cy="180" r="1"/>
    <circle class="sparkle-7" cx="80" cy="350" r="1.1"/>
  </g>
</g>

</svg>
